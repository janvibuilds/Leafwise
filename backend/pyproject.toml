[project]
name = "plant-disease-backend"
version = "0.1.0"
description = "FastAPI backend for plant disease classification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9",
    "supabase>=2.34,<3",
    "PyJWT>=2.9,<3",
    "pillow>=10,<12",
    "numpy>=1.26,<3",
    "tensorflow>=2.18,<2.21",
    "keras>=3.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.8",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "fakes"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["tensorflow.*", "keras.*", "supabase.*", "postgrest.*", "gotrue.*", "storage3.*", "realtime.*"]
ignore_missing_imports = true
