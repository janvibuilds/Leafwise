name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much
        detail as possible so we can reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click "Analyze leaf", the request…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the problem.
      placeholder: |
        1. Go to '…'
        2. Upload a photo of '…'
        3. Click '…'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include exact error messages or HTTP status codes if any.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser + version, Python and Node versions, how you run the app (local dev, Docker…).
      placeholder: |
        - OS: Windows 11 / macOS 15 / Ubuntu 24.04
        - Browser: Chrome 141
        - Python: 3.12.6
        - Node: 24.20.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant backend or browser console output (redact secrets!).
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find this one
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true
