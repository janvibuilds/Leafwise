name: Feature request
description: Suggest an idea or improvement for the project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping Leafwise improve! Describe the problem first —
        solutions come second.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve? Who benefits?
      placeholder: As a gardener using the history page, I can't…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you've thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (Next.js)
        - Backend (FastAPI)
        - Database / Supabase
        - Documentation
        - CI / tooling
        - Model / inference
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find this request
          required: true
        - label: I'm willing to help implement this
